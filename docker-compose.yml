services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: clinicadb-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-DswiT1_Passw0rd!}
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
      - ./Database:/scripts:ro
volumes:
  sqldata:
